<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script>window.dataVersion = '20260513_1750';</script>
    <title>客服清洗数据看板 - CC+钉钉整合</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <script>if(typeof echarts==='undefined'){document.write('<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"><\/script>');}</script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #06080f 0%, #0f172a 40%, #1a1a2e 100%);
            color: #f1f5f9;
            padding: 20px;
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.03) 1px, transparent 0);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 0;
        }
        body > * { position: relative; z-index: 1; }
        .header {
            background: linear-gradient(135deg, #312e81 0%, #4f46e5 25%, #7c3aed 50%, #a855f7 75%, #ec4899 100%);
            padding: 48px 44px;
            border-radius: 24px;
            margin-bottom: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(79,70,229,0.35), 0 0 100px rgba(168,85,247,0.12);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .header::before {
            content: '';
            position: absolute;
            top: -60%; left: -30%;
            width: 160%; height: 220%;
            background: radial-gradient(ellipse at 25% 35%, rgba(255,255,255,0.10) 0%, transparent 55%),
                        radial-gradient(ellipse at 75% 65%, rgba(255,255,255,0.07) 0%, transparent 45%);
            animation: headerGlow 10s ease-in-out infinite alternate;
        }
        .header h1 {
            font-size: 42px;
            margin-bottom: 12px;
            position: relative;
            letter-spacing: 2px;
            text-shadow: 0 2px 24px rgba(0,0,0,0.4);
            font-weight: 800;
        }
        .header p {
            opacity: 0.9;
            position: relative;
            font-size: 15px;
            letter-spacing: 1.5px;
            color: rgba(255,255,255,0.85);
        }
        
        .filter-bar {
            background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.015) 100%);
            backdrop-filter: blur(16px);
            padding: 18px 26px;
            border-radius: 18px;
            margin-bottom: 28px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: nowrap;
            border: 1px solid rgba(255,255,255,0.07);
            box-shadow: 0 2px 20px rgba(0,0,0,0.15);
            position: relative;
        }
        .filter-bar::after {
            content: '';
            position: absolute;
            bottom: 0; left: 10%; right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(99,102,241,0.3), transparent);
        }
        .filter-item { display: flex; align-items: center; gap: 8px; }
        .filter-item label { color: #94a3b8; font-size: 14px; }
        select, input[type="date"] {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 14px;
        }
        select option {
            background: #1e293b;
            color: #fff;
            padding: 8px;
            font-size: 14px;
        }
        select {
            min-width: 140px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.02) 100%);
            backdrop-filter: blur(12px);
            padding: 28px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 12px 36px rgba(0,0,0,0.3);
            border-color: rgba(255,255,255,0.18);
        }
        .stat-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3.5px;
            border-radius: 18px 18px 0 0;
        }
        .stat-card.total::after { background: linear-gradient(90deg, #60a5fa, #3b82f6, #818cf8); box-shadow: 0 0 12px rgba(96,165,250,0.5); }
        .stat-card.clean::after { background: linear-gradient(90deg, #f472b6, #ec4899, #f43f5e); box-shadow: 0 0 12px rgba(244,114,182,0.4); }
        .stat-card.valid::after { background: linear-gradient(90deg, #34d399, #10b981, #059669); box-shadow: 0 0 12px rgba(52,211,153,0.45); }
        .stat-card.rate::after { background: linear-gradient(90deg, #fbbf24, #f59e0b, #d97706); box-shadow: 0 0 12px rgba(251,191,36,0.45); }
        .stat-card.kezi::after { background: linear-gradient(90deg, #a78bfa, #8b5cf6, #7c3aed); box-shadow: 0 0 12px rgba(167,139,250,0.45); }
        .stat-card h3 {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        .stat-value {
            font-size: 44px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #f1f5f9;
            text-shadow: 0 0 30px rgba(255,255,255,0.08);
            letter-spacing: -1px;
        }
        .stat-breakdown {
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.5;
        }
        .stat-breakdown span.cc-tag { color: #60a5fa; }
        .stat-breakdown span.dd-tag { color: #34d399; }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            margin-bottom: 24px;
        }
        .chart-container {
            background: linear-gradient(145deg, rgba(255,255,255,0.035) 0%, rgba(255,255,255,0.005) 100%);
            padding: 22px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.07);
            height: 380px;
            transition: all 0.3s ease;
            position: relative;
        }
        .chart-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.06) 50%, transparent 100%);
            border-radius: 18px 18px 0 0;
        }
        .chart-container:hover {
            border-color: rgba(99,102,241,0.18);
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            background: linear-gradient(145deg, rgba(255,255,255,0.045) 0%, rgba(255,255,255,0.008) 100%);
        }
        .chart-container.full-width {
            grid-column: 1 / -1;
            height: 420px;
        }
        .chart-title {
            font-size: 15px;
            font-weight: 700;
            color: #e2e8f0;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .chart-content {
            height: calc(100% - 35px);
        }
        
        .detail-section {
            background: linear-gradient(145deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.01) 100%);
            backdrop-filter: blur(14px);
            padding: 28px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 28px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.12);
            position: relative;
        }
        .detail-section::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.06) 50%, transparent 100%);
            border-radius: 20px 20px 0 0;
        }
        .detail-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .brand-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .brand-grid.has-summary {
            grid-template-columns: 1fr;
        }
        .brand-card {
            padding: 0;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            overflow: hidden;
            transition: transform 0.25s, box-shadow 0.25s;
            position: relative;
        }
        .brand-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            border-radius: 16px 16px 0 0;
        }
        .brand-card:nth-child(1)::before { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
        .brand-card:nth-child(2)::before { background: linear-gradient(90deg, #06b6d4, #22d3ee); }
        .brand-card:nth-child(3)::before { background: linear-gradient(90deg, #8b5cf6, #a78bfa); }
        .brand-card:nth-child(4)::before { background: linear-gradient(90deg, #f472b6, #f9a8d4); }
        .brand-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.35);
        }
        .brand-card.summary-card {
            background: linear-gradient(135deg, rgba(99,102,241,0.10) 0%, rgba(167,139,250,0.04) 100%);
            border: 1px solid rgba(99,102,241,0.20);
        }
        .brand-card.summary-card::before {
            background: linear-gradient(90deg, #6366f1, #a78bfa, #6366f1) !important;
            height: 3px;
        }
        .brand-card-header {
            padding: 18px 18px 14px;
            position: relative;
        }
        .brand-card-header h4 {
            font-size: 17px;
            font-weight: 700;
            margin: 0 0 14px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }
        .brand-summary-row {
            display: flex;
            gap: 6px;
        }
        .brand-summary-item {
            flex: 1;
            text-align: center;
            padding: 8px 4px;
            border-radius: 10px;
            background: rgba(255,255,255,0.04);
        }
        .brand-summary-item .value {
            font-size: 18px;
            font-weight: 800;
            display: block;
            line-height: 1.2;
        }
        .brand-summary-item .label {
            font-size: 10px;
            color: #64748b;
            display: block;
            margin-top: 2px;
        }
        .brand-type-section {
            padding: 8px 14px 16px;
        }
        .brand-type-row {
            display: flex;
            align-items: center;
            padding: 8px 14px;
            margin: 3px 0;
            border-radius: 10px;
            background: rgba(255,255,255,0.02);
            gap: 10px;
            transition: background 0.2s;
        }
        .brand-type-row:hover {
            background: rgba(255,255,255,0.06);
        }
        .brand-type-dot {
            width: 8px;
            height: 8px;
            border-radius: 3px;
            flex-shrink: 0;
            box-shadow: 0 0 6px rgba(255,255,255,0.15);
        }
        .brand-type-name {
            font-size: 12px;
            font-weight: 600;
            width: 64px;
            flex-shrink: 0;
            letter-spacing: 0.3px;
        }
        .brand-type-data {
            display: flex;
            flex: 1;
            gap: 6px;
            justify-content: space-around;
        }
        .brand-type-cell {
            text-align: center;
            width: 58px;
            padding: 2px 0;
        }
        .brand-type-cell .num {
            font-size: 13px;
            font-weight: 700;
            color: #e2e8f0;
            display: block;
            line-height: 1.4;
        }
        .brand-type-cell .unit {
            font-size: 9px;
            color: #475569;
            letter-spacing: 0.5px;
        }
        .brand-type-rate-wrap {
            width: 60px;
            text-align: right;
            flex-shrink: 0;

        }
        .brand-type-rate {
            font-size: 14px;
            font-weight: 800;
        }
        .brand-type-bar {
            height: 3px;
            border-radius: 2px;
            background: rgba(255,255,255,0.06);
            margin-top: 3px;
            overflow: hidden;
        }
        .brand-type-bar-inner {
            height: 100%;
            border-radius: 2px;
            transition: width 0.6s ease;
        }
        
        .data-table { width: 100%; border-collapse: separate; border-spacing: 0; }
        .data-table th, .data-table td {
            padding: 13px 18px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .data-table th {
            color: #64748b;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            background: rgba(15,23,42,0.95);
            backdrop-filter: blur(8px);
            z-index: 1;
        }
        .data-table td { color: #e2e8f0; font-size: 13px; }
        .data-table tbody tr {
            transition: background 0.15s ease;
        }
        .data-table tbody tr:hover { background: rgba(99,102,241,0.06); }
        .data-table tbody tr:nth-child(even) { background: rgba(255,255,255,0.008); }

        /* 客服工作量排行 - 卡片式布局（美化版） */
        .visitor-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }
        .visitor-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
            border-radius: 18px;
            padding: 22px 24px;
            border: 1px solid rgba(255,255,255,0.09);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .visitor-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.35);
            border-color: rgba(99,102,241,0.25);
        }
        .visitor-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6, #a78bfa);
            opacity: 0.8;
        }
        /* 前三名特殊光效 */
        .visitor-card.rank-1::before { background: linear-gradient(90deg, #fbbf24, #f59e0b, #d97706); opacity: 1; height: 4px;}
        .visitor-card.rank-2::before { background: linear-gradient(90deg, #94a3b8, #64748b, #475569); opacity: 1; height: 4px;}
        .visitor-card.rank-3::before { background: linear-gradient(90deg, #cd7c2f, #a16207, #854d0e); opacity: 1; height: 4px;}

        .visitor-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }
        .visitor-rank {
            width: 38px; height: 38px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 17px;
            color: #0f172a;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .visitor-name {
            font-size: 19px; font-weight: 700; color: #fff;
            letter-spacing: 0.5px;
        }

        .visitor-types {
            display: flex; flex-direction: column; gap: 9px;
        }
        .type-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 11px 15px;
            border-radius: 11px;
            transition: all 0.2s ease;
        }
        .type-row:hover { transform: translateX(3px); filter: brightness(1.1); }
        .type-row.card { background: rgba(16,185,129,0.08); border-left: 3.5px solid #34d399; }
        .type-row.jx { background: rgba(245,158,11,0.08); border-left: 3.5px solid #fbbf24; }
        .type-row.other { background: rgba(100,116,139,0.12); border-left: 3.5px solid #94a3b8; }
        /* 汇总卡片特殊样式 */
        .summary-total-card {
            grid-column: 1 / -1;  /* 占满整行 */
            background: linear-gradient(145deg, rgba(99,102,241,0.1) 0%, rgba(139,92,246,0.04) 100%);
            border: 1.5px solid rgba(99,102,241,0.25);
        }
        .summary-total-card::before {
            background: linear-gradient(90deg, #6366f1, #8b5cf6, #a78bfa) !important;
        }
        .type-label { font-size: 13px; color: #cbd5e1; min-width: 90px; font-weight: 500; }
        .type-stats { font-size: 14px; color: #cbd5e1; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
        .type-stats b { color: #fff; font-size: 15px; font-weight: 600; }
        .type-rate {
            font-size: 14px; font-weight: 700; margin-left: 8px;
            padding: 2px 8px; border-radius: 6px;
            min-width: 52px; text-align: center; display: inline-block;
        }
        .type-row.card .type-rate { background: rgba(16,185,129,0.15); color: #34d399; }
        .type-row.jx .type-rate { background: rgba(245,158,11,0.15); color: #fbbf24; }
        .type-row.other .type-rate { background: rgba(100,116,139,0.2); color: #94a3b8; }

        .visitor-summary-bar {
            display: flex; align-items: center; gap: 18px;
            padding: 12px 16px;
            margin-bottom: 14px;
            background: linear-gradient(90deg, rgba(99,102,241,0.08) 0%, rgba(139,92,246,0.05) 100%);
            border-radius: 12px;
            border: 1px solid rgba(99,102,241,0.12);
            font-size: 14px;
        }
        .sum-item { color: #94a3b8; letter-spacing: 0.3px; }
        .sum-item b { color: #e2e8f0; font-size: 16px; font-weight: 600; }
        .sum-item:nth-child(1) b { color: #60a5fa; }   /* 电话蓝色 */
        .sum-item:nth-child(3) b { color: #34d399; }   /* 有效绿色 */
        .sum-rate {
            font-size: 21px; font-weight: 800;
            color: #34d399;
            margin-left: auto;
            text-shadow: 0 0 20px rgba(52,211,153,0.3);
            padding: 3px 12px;
            background: rgba(52,211,153,0.08);
            border-radius: 8px;
        }

        @media (max-width: 1200px) {
            .stats-grid { grid-template-columns: repeat(3, 1fr); }
            .charts-grid { grid-template-columns: 1fr; }
            .brand-grid { grid-template-columns: repeat(2, 1fr); }
            .visitor-cards { grid-template-columns: 1fr; }
        }

        @keyframes headerGlow {
            from { transform: translate(0, 0); }
            to { transform: translate(2%, -2%); }
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 3px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        /* 页面载入动画 */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .header    { animation: fadeInUp 0.5s ease 0.05s both; }
        .filter-bar  { animation: fadeInUp 0.5s ease 0.12s both; }
        .stats-grid  { animation: fadeInUp 0.5s ease 0.2s both; }
        .charts-grid  { animation: fadeInUp 0.5s ease 0.3s both; }
        .detail-section { animation: fadeInUp 0.5s ease 0.4s both; }
    </style>
</head>
<body>

<!-- 登录遮罩 -->
<div id="login-overlay">
  <div id="login-box">
    <h2>&#x1F510; 身份验证</h2>
    <p>请输入访问密码</p>
    <input type="password" id="login-input" placeholder="请输入密码" autofocus>
    <button id="login-btn">确认</button>
    <div id="login-error">密码错误，请重试</div>
  </div>
</div>

<div id="app">
    <div class="header">
        <h1>📊 客服清洗数据看板</h1>
        <p>CC系统 + 钉钉跟进 | 品牌×客资类型交叉分析</p>
    </div>

    <div class="filter-bar">
        <div class="filter-item">
            <label>开始日期</label>
            <input type="date" id="startDate" onchange="applyFilter()">
        </div>
        <div class="filter-item">
            <label>结束日期</label>
            <input type="date" id="endDate" onchange="applyFilter()">
        </div>
        <div class="filter-item">
            <label>品牌筛选</label>
            <select id="brandFilter" onchange="applyFilter()">
                <option value="all">全部品牌</option>
                <option value="美的">美的</option>
                <option value="小天鹅">小天鹅</option>
                <option value="COLMO">COLMO</option>
                <option value="东芝">东芝</option>
            </select>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card kezi">
            <h3>📋 客资量</h3>
            <div class="stat-value" id="keziCount">-</div>
        </div>
        <div class="stat-card total">
            <h3>📞 总电话量</h3>
            <div class="stat-value" id="totalCalls">-</div>
            <div class="stat-breakdown" id="totalCallsBreakdown"></div>
        </div>
        <div class="stat-card clean">
            <h3>🧹 清洗量</h3>
            <div class="stat-value" id="cleanCount">-</div>
            <div class="stat-breakdown" id="cleanCountBreakdown"></div>
        </div>
        <div class="stat-card valid">
            <h3>✅ 有效量</h3>
            <div class="stat-value" id="validCount">-</div>

        var DATA; // 解密后的看板数据

        let trendChart, brandChart, customerTypeChart, heatmapChart, visitorChart, channelChart, funnelChart, brandTrendChart, visitorTypeChart, dualAxisChart;

        function init() {
            initDatePicker();
            initCharts();
            applyFilter();
        }

        function initDatePicker() {
            const dates = DATA.map(d => d['日期']);
            document.getElementById('startDate').min = dates[0];
            document.getElementById('startDate').max = dates[dates.length - 1];
            document.getElementById('startDate').value = dates[0];
            document.getElementById('endDate').min = dates[0];
            document.getElementById('endDate').max = dates[dates.length - 1];
            document.getElementById('endDate').value = dates[dates.length - 1];
        }

        function initCharts() {
            trendChart = echarts.init(document.getElementById('trendChart'));
            brandChart = echarts.init(document.getElementById('brandChart'));
            customerTypeChart = echarts.init(document.getElementById('customerTypeChart'));
            heatmapChart = echarts.init(document.getElementById('heatmapChart'));
            visitorChart = echarts.init(document.getElementById('visitorChart'));
            channelChart = echarts.init(document.getElementById('channelChart'));
            funnelChart = echarts.init(document.getElementById('funnelChart'));
            brandTrendChart = echarts.init(document.getElementById('brandTrendChart'));
            visitorTypeChart = echarts.init(document.getElementById('visitorTypeChart'));
            dualAxisChart = echarts.init(document.getElementById('dualAxisChart'));
        }

        function mergeData(startDate, endDate, brandFilter) {
            let filtered = DATA.filter(d => d['日期'] >= startDate && d['日期'] <= endDate);
            
            const summary = {
                kezi_count: 0,
                total_calls: 0,
                total_calls_cc: 0,
                total_calls_dd: 0,
                clean_count: 0,
                clean_count_cc: 0,
                clean_count_dd: 0,
                valid_count: 0,
                valid_count_cc: 0,
                valid_count_dd: 0,
                brand_distribution: {},
                customer_type_distribution: {},
                visitor_stats: {},
                // 品牌维度：客资量
                brand_kezi: {},
                // 品牌维度：电话量/清洗量/有效量
                brand_calls: {},
                brand_clean: {},
                brand_valid: {},
                // 品牌×客资类型：清洗量/有效量
                brand_type_clean: {},
                brand_type_valid: {},
                // 回访人维度：电话量/清洗量/有效量
                visitor_calls: {},
                visitor_clean: {},
                visitor_valid: {},
                // 回访人维度：按客资类型拆分
                visitor_type_detail: {},
                // 回访人维度：按客资类型拆分的清洗量/有效量
                visitor_type_clean: {},
                visitor_type_valid: {},
                brand_customer_cross: {},
                brand_type_kezi: {},
                call_status: {},
                daily_data: filtered
            };
            
            filtered.forEach(day => {
                // 合并指标（支持品牌筛选）
                if (brandFilter === 'all') {
                    summary.kezi_count += (day['客资量'] || 0);
                    summary.total_calls += day['总电话量'];
                    summary.total_calls_cc += day['总电话量_CC'];
                    summary.total_calls_dd += day['总电话量_钉钉'];
                    summary.clean_count += day['清洗量'];
                    summary.clean_count_cc += day['清洗量_CC'];
                    summary.clean_count_dd += day['清洗量_钉钉'];
                    summary.valid_count += day['有效量'];
                    summary.valid_count_cc += day['有效量_CC'];
                    summary.valid_count_dd += day['有效量_钉钉'];

                    // 品牌分布
                    Object.entries(day['品牌分布']).forEach(([brand, count]) => {
                        summary.brand_distribution[brand] = (summary.brand_distribution[brand] || 0) + count;
                    });

                    // 品牌维度：客资量/电话量/清洗量/有效量
                    var keziBrand = day['客资量_品牌'] || {};
                    var ccBrandDist = day['品牌分布_CC'] || {};
                    var ddBrandDist = day['品牌分布_钉钉'] || {};
                    ['美的', '小天鹅', 'COLMO', '东芝'].forEach(function(brand) {
                        summary.brand_kezi[brand] = (summary.brand_kezi[brand] || 0) + (keziBrand[brand] || 0);
                        summary.brand_calls[brand] = (summary.brand_calls[brand] || 0) + (ccBrandDist[brand] || 0) + (ddBrandDist[brand] || 0);
                        summary.brand_clean[brand] = (summary.brand_clean[brand] || 0) + ((day['品牌清洗量'] || {})[brand] || 0);
                        summary.brand_valid[brand] = (summary.brand_valid[brand] || 0) + ((day['品牌有效量'] || {})[brand] || 0);
                    });

                    // 品牌×客资类型：客资量/清洗量/有效量累加
                    var btk = day['品牌_类型_客资量'] || {};
                    var btc = day['品牌_类型_清洗量'] || {};
                    var btv = day['品牌_类型_有效量'] || {};
                    ['美的', '小天鹅', 'COLMO', '东芝'].forEach(function(brand) {
                        if (!summary.brand_type_kezi[brand]) {
                            summary.brand_type_kezi[brand] = {'客服卡片': 0, '家享联盟': 0, '其他': 0};
                        }
                        if (!summary.brand_type_clean[brand]) {
                            summary.brand_type_clean[brand] = {'客服卡片': 0, '家享联盟': 0, '其他': 0};
                        }
                        if (!summary.brand_type_valid[brand]) {
                            summary.brand_type_valid[brand] = {'客服卡片': 0, '家享联盟': 0, '其他': 0};
                        }
                        var bk = btk[brand] || {};
                        var bc = btc[brand] || {};
                        var bv = btv[brand] || {};
                        // 客资量：只有客服卡片、家享联盟、其他（留资表无智投）
                        summary.brand_type_kezi[brand]['客服卡片'] += (bk['客服卡片'] || 0);
                        summary.brand_type_kezi[brand]['家享联盟'] += (bk['家享联盟'] || 0);
                        summary.brand_type_kezi[brand]['其他'] += (bk['其他'] || 0);
                        // 清洗量/有效量：智投线索通数据合并到"其他"
                        summary.brand_type_clean[brand]['客服卡片'] += (bc['客服卡片'] || 0);
                        summary.brand_type_clean[brand]['家享联盟'] += (bc['家享联盟'] || 0);
                        summary.brand_type_clean[brand]['其他'] += (bc['其他'] || 0) + (bc['智投线索通'] || 0);
                        summary.brand_type_valid[brand]['客服卡片'] += (bv['客服卡片'] || 0);
                        summary.brand_type_valid[brand]['家享联盟'] += (bv['家享联盟'] || 0);
                        summary.brand_type_valid[brand]['其他'] += (bv['其他'] || 0) + (bv['智投线索通'] || 0);
                    });

                    // 客资类型分布
                    Object.entries(day['客资类型分布']).forEach(([type, count]) => {
                        summary.customer_type_distribution[type] = (summary.customer_type_distribution[type] || 0) + count;
                    });
                    
                    // 外呼状态
                    Object.entries(day['外呼状态'] || {}).forEach(([status, count]) => {
                        summary.call_status[status] = (summary.call_status[status] || 0) + count;
                    });

                    // 回访人统计
                    Object.entries(day['回访人统计']).forEach(([visitor, count]) => {
                        summary.visitor_stats[visitor] = (summary.visitor_stats[visitor] || 0) + count;
                    });
                    
                    // 回访人维度：电话量/清洗量/有效量
                    Object.entries(day['回访人_电话量'] || {}).forEach(([visitor, count]) => {
                        summary.visitor_calls[visitor] = (summary.visitor_calls[visitor] || 0) + count;
                    });
                    Object.entries(day['回访人_清洗量'] || {}).forEach(([visitor, count]) => {
                        summary.visitor_clean[visitor] = (summary.visitor_clean[visitor] || 0) + count;
                    });
                    Object.entries(day['回访人_有效量'] || {}).forEach(([visitor, count]) => {
                        summary.visitor_valid[visitor] = (summary.visitor_valid[visitor] || 0) + count;
                    });
                    
                    // 回访人维度：按客资类型拆分（从JSON字段直接取）
                    ['客服卡片', '家享联盟', '其他'].forEach(function(type) {
                        // 按类型电话量
                        var tc = day['回访人_类型_电话量'] || {};
                        Object.entries(tc).forEach(([v, c]) => {
                            if (!summary.visitor_type_detail[v]) { summary.visitor_type_detail[v] = {'客服卡片': 0, '家享联盟': 0, '其他': 0}; }
                            if (c && typeof c === 'object') { summary.visitor_type_detail[v][type] += (c[type] || 0); }
                            else { summary.visitor_type_detail[v]['客服卡片'] += c || 0; }  // fallback
                        });
                        // 按类型清洗量
                        var cl = day['回访人_类型_清洗量'] || {};
                        Object.entries(cl).forEach(([v, c]) => {
                            if (!summary.visitor_type_clean[v]) { summary.visitor_type_clean[v] = {'客服卡片': 0, '家享联盟': 0, '其他': 0}; }
                            if (c && typeof c === 'object') { summary.visitor_type_clean[v][type] += (c[type] || 0); }
                            else { summary.visitor_type_clean[v]['客服卡片'] += c || 0; }
                        });
                        // 按类型有效量
                        var vl = day['回访人_类型_有效量'] || {};
                        Object.entries(vl).forEach(([v, c]) => {
                            if (!summary.visitor_type_valid[v]) { summary.visitor_type_valid[v] = {'客服卡片': 0, '家享联盟': 0, '其他': 0}; }
                            if (c && typeof c === 'object') { summary.visitor_type_valid[v][type] += (c[type] || 0); }
                            else { summary.visitor_type_valid[v]['客服卡片'] += c || 0; }
                        });
                    });
                    
                    // 品牌客资交叉
                    Object.entries(day['品牌客资交叉']).forEach(([brand, types]) => {
                        if (!summary.brand_customer_cross[brand]) {
                            summary.brand_customer_cross[brand] = {};
                        }
                        Object.entries(types).forEach(([type, count]) => {
                            summary.brand_customer_cross[brand][type] = (summary.brand_customer_cross[brand][type] || 0) + count;
                        });
                    });
                } else {
                    // 按品牌筛选：只取该品牌的数据
                    const brandDist = day['品牌分布_钉钉'] || {};
                    const ccBrandDist = day['品牌分布_CC'] || {};
                    const ddBrandDist = day['品牌分布_钉钉'] || {};
                    const crossCC = day['品牌客资交叉_CC'] || {};
                    const crossDD = day['品牌客资交叉_钉钉'] || {};
                    const visitorCC = day['回访人统计_CC'] || {};
                    const visitorDD = day['回访人统计_钉钉'] || {};

                    // 该品牌的客资量（从每日留资表的品牌明细中取值）
                    const keziBrand = day['客资量_品牌'] || {};
                    summary.kezi_count += (keziBrand[brandFilter] || 0);

                    // 该品牌的电话量
                    summary.total_calls += (ccBrandDist[brandFilter] || 0) + (ddBrandDist[brandFilter] || 0);
                    summary.total_calls_cc += ccBrandDist[brandFilter] || 0;
                    summary.total_calls_dd += ddBrandDist[brandFilter] || 0;

                    // 清洗量：直接从后端字段取值（精确）
                    summary.clean_count += (day['品牌清洗量'] || {})[brandFilter] || 0;
                    summary.clean_count_cc += (day['品牌清洗量_CC'] || {})[brandFilter] || 0;
                    summary.clean_count_dd += (day['品牌清洗量_钉钉'] || {})[brandFilter] || 0;

                    // 有效量：直接从后端字段取值（精确）
                    summary.valid_count += (day['品牌有效量'] || {})[brandFilter] || 0;
                    summary.valid_count_cc += (day['品牌有效量_CC'] || {})[brandFilter] || 0;
                    summary.valid_count_dd += (day['品牌有效量_钉钉'] || {})[brandFilter] || 0;

                    // 品牌×类型：客资量/清洗量/有效量（品牌筛选模式）
                    if (!summary.brand_type_kezi[brandFilter]) {
                        summary.brand_type_kezi[brandFilter] = {'客服卡片': 0, '家享联盟': 0, '其他': 0};
                    }
                    if (!summary.brand_type_clean[brandFilter]) {
                        summary.brand_type_clean[brandFilter] = {'客服卡片': 0, '家享联盟': 0, '其他': 0};
                    }
                    if (!summary.brand_type_valid[brandFilter]) {
                        summary.brand_type_valid[brandFilter] = {'客服卡片': 0, '家享联盟': 0, '其他': 0};
                    }
                    var btk2 = (day['品牌_类型_客资量'] || {})[brandFilter] || {};
                    var btc2 = (day['品牌_类型_清洗量'] || {})[brandFilter] || {};
                    var btv2 = (day['品牌_类型_有效量'] || {})[brandFilter] || {};
                    // 客资量：留资表无智投线索通
                    summary.brand_type_kezi[brandFilter]['客服卡片'] += (btk2['客服卡片'] || 0);
                    summary.brand_type_kezi[brandFilter]['家享联盟'] += (btk2['家享联盟'] || 0);
                    summary.brand_type_kezi[brandFilter]['其他'] += (btk2['其他'] || 0);
                    // 清洗量/有效量：智投线索通合并到"其他"
                    summary.brand_type_clean[brandFilter]['客服卡片'] += (btc2['客服卡片'] || 0);
                    summary.brand_type_clean[brandFilter]['家享联盟'] += (btc2['家享联盟'] || 0);
                    summary.brand_type_clean[brandFilter]['其他'] += (btc2['其他'] || 0) + (btc2['智投线索通'] || 0);
                    summary.brand_type_valid[brandFilter]['客服卡片'] += (btv2['客服卡片'] || 0);
                    summary.brand_type_valid[brandFilter]['家享联盟'] += (btv2['家享联盟'] || 0);
                    summary.brand_type_valid[brandFilter]['其他'] += (btv2['其他'] || 0) + (btv2['智投线索通'] || 0);

                    // 品牌分布（只有选中的品牌）
                    summary.brand_distribution[brandFilter] = (summary.brand_distribution[brandFilter] || 0)
                        + (ccBrandDist[brandFilter] || 0) + (ddBrandDist[brandFilter] || 0);
                    
                    // 客资类型分布（只取选中品牌的）
                    if (crossCC[brandFilter]) {
                        Object.entries(crossCC[brandFilter]).forEach(([type, count]) => {
                            summary.customer_type_distribution[type] = (summary.customer_type_distribution[type] || 0) + count;
                        });
                    }
                    if (crossDD[brandFilter]) {
                        Object.entries(crossDD[brandFilter]).forEach(([type, count]) => {
                            summary.customer_type_distribution[type] = (summary.customer_type_distribution[type] || 0) + count;
                        });
                    }

                    // 回访人统计：从三维交叉表按品牌汇总（替代原来用全品牌回访人统计_CC/钉钉的bug）
                    var vbtForStats = day['回访人_品牌_类型'] || {};
                    Object.entries(vbtForStats).forEach(([visitor, brands_data]) => {
                        if (brands_data[brandFilter]) {
                            var btStat = brands_data[brandFilter];
                            var statTotal = Object.values(btStat).reduce(function(a,b){return a+b;}, 0);
                            summary.visitor_stats[visitor] = (summary.visitor_stats[visitor] || 0) + statTotal;
                        }
                    });

                    // 品牌筛选时：从三维交叉表汇总每个人的电话量/清洗量/有效量
                    var vbt_calls = day['回访人_品牌_类型'] || {};
                    var vbt_clean = day['回访人_品牌_类型_清洗量'] || {};
                    var vbt_valid = day['回访人_品牌_类型_有效量'] || {};

                    Object.entries(vbt_calls).forEach(([visitor, brands_data]) => {
                        if (brands_data[brandFilter]) {
                            var bt = brands_data[brandFilter];
                            // 电话量
                            var pTotal = Object.values(bt).reduce(function(a,b){return a+b;}, 0);
                            summary.visitor_calls[visitor] = (summary.visitor_calls[visitor] || 0) + pTotal;

                            // 按客资类型拆分（电话量）
                            if (!summary.visitor_type_detail[visitor]) { summary.visitor_type_detail[visitor] = {'客服卡片': 0, '家享联盟': 0, '其他': 0}; }
                            ['客服卡片', '家享联盟', '其他'].forEach(function(t) {
                                summary.visitor_type_detail[visitor][t] += (bt[t] || 0);
                            });
                        }
                    });

                    // 清洗量（从三维交叉表精确取值）
                    Object.entries(vbt_clean).forEach(([visitor, brands_data]) => {
                        if (brands_data[brandFilter]) {
                            var btC = brands_data[brandFilter];
                            var cTotal = Object.values(btC).reduce(function(a,b){return a+b;}, 0);
                            summary.visitor_clean[visitor] = (summary.visitor_clean[visitor] || 0) + cTotal;

                            if (!summary.visitor_type_clean[visitor]) { summary.visitor_type_clean[visitor] = {'客服卡片': 0, '家享联盟': 0, '其他': 0}; }
                            ['客服卡片', '家享联盟', '其他'].forEach(function(t) {
                                summary.visitor_type_clean[visitor][t] += (btC[t] || 0);
                            });
                        }
                    });

                    // 有效量（从三维交叉表精确取值）
                    Object.entries(vbt_valid).forEach(([visitor, brands_data]) => {
                        if (brands_data[brandFilter]) {
                            var btV = brands_data[brandFilter];
                            var vTotal = Object.values(btV).reduce(function(a,b){return a+b;}, 0);
                            summary.visitor_valid[visitor] = (summary.visitor_valid[visitor] || 0) + vTotal;

                            if (!summary.visitor_type_valid[visitor]) { summary.visitor_type_valid[visitor] = {'客服卡片': 0, '家享联盟': 0, '其他': 0}; }
                            ['客服卡片', '家享联盟', '其他'].forEach(function(t) {
                                summary.visitor_type_valid[visitor][t] += (btV[t] || 0);
                            });
                        }
                    });

                    // 品牌客资交叉
                    if (!summary.brand_customer_cross[brandFilter]) {
                        summary.brand_customer_cross[brandFilter] = {'客服卡片': 0, '家享联盟': 0, '其他': 0};
                    }
                    if (crossCC[brandFilter]) {
                        Object.entries(crossCC[brandFilter]).forEach(([type, count]) => {
                            summary.brand_customer_cross[brandFilter][type] =
                                (summary.brand_customer_cross[brandFilter][type] || 0) + count;
                        });
                    }
                    if (crossDD[brandFilter]) {
                        Object.entries(crossDD[brandFilter]).forEach(([type, count]) => {
                            summary.brand_customer_cross[brandFilter][type] =
                                (summary.brand_customer_cross[brandFilter][type] || 0) + count;
                        });
                    }
                }
            });
            
            summary.valid_rate = summary.clean_count > 0 ? (summary.valid_count / summary.clean_count * 100).toFixed(1) : 0;
            
            return summary;
        }

        function applyFilter() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const brandFilter = document.getElementById('brandFilter').value;
            
            const summary = mergeData(startDate, endDate, brandFilter);
            
            // 更新统计卡片 - 显示CC和钉钉分别的数据
            document.getElementById('keziCount').textContent = summary.kezi_count.toLocaleString();
            document.getElementById('totalCalls').textContent = summary.total_calls.toLocaleString();
            document.getElementById('cleanCount').textContent = summary.clean_count.toLocaleString();
            document.getElementById('validCount').textContent = summary.valid_count.toLocaleString();
            document.getElementById('validRate').textContent = summary.valid_rate + '%';

            // 数据源分解显示
            document.getElementById('totalCallsBreakdown').innerHTML =
                '<span class="cc-tag">CC: ' + summary.total_calls_cc.toLocaleString() +
                '</span>&nbsp;&nbsp;<span class="dd-tag">钉钉: ' + summary.total_calls_dd.toLocaleString() + '</span>';
            document.getElementById('cleanCountBreakdown').innerHTML =
                '<span class="cc-tag">CC: ' + summary.clean_count_cc.toLocaleString() +
                '</span>&nbsp;&nbsp;<span class="dd-tag">钉钉: ' + summary.clean_count_dd.toLocaleString() + '</span>';
            document.getElementById('validCountBreakdown').innerHTML =
                '<span class="cc-tag">CC: ' + summary.valid_count_cc.toLocaleString() +
                '</span>&nbsp;&nbsp;<span class="dd-tag">钉钉: ' + summary.valid_count_dd.toLocaleString() + '</span>';
            
            updateCharts(summary, brandFilter);
            updateBrandDetail(summary, brandFilter);
            updateVisitorTable(summary);
        }

<script>
// ===== 登录验证 =====
(function() {
  var KEY = 'cc_kefu_auth_ok';

  function checkAuth() {
    if (localStorage.getItem(KEY)) {
      document.getElementById('login-overlay').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      decryptAndLoad(localStorage.getItem(KEY));
    } else {
      document.getElementById('app').style.display = 'none';
    }
  }

  function doLogin() {
    var pwd = document.getElementById('login-input').value;
    if (!pwd) return;
    decryptAndLoad(pwd);
  }

  async function decryptAndLoad(pwd) {
    try {
      var enc = new TextEncoder();
      var keyMaterial = await crypto.subtle.importKey(
        'raw', enc.encode(pwd), {name:'PBKDF2'}, false, ['deriveKey']
      );
      var key = await crypto.subtle.deriveKey(
        { name:'PBKDF2', salt: enc.encode('dashboard'), iterations:10000, hash:'SHA-256' },
        keyMaterial, { name:'AES-CBC', length:256 }, false, ['decrypt']
      );
      var bin = atob(encryptedData);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var iv = bytes.slice(0, 16);
      var data = bytes.slice(16);
      var decrypted = await crypto.subtle.decrypt({name:'AES-CBC', iv:iv}, key, data);
      var jsonStr = new TextDecoder().decode(decrypted);
      DATA = JSON.parse(jsonStr);
      localStorage.setItem(KEY, pwd);
      document.getElementById('login-overlay').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      init();
    } catch(e) {
      localStorage.removeItem(KEY);
      document.getElementById('login-overlay').style.display = '';
      document.getElementById('app').style.display = 'none';
      document.getElementById('login-error').style.display = 'block';
      document.getElementById('login-input').value = '';
      document.getElementById('login-input').focus();
    }
  }

  document.getElementById('login-btn').addEventListener('click', doLogin);
  document.getElementById('login-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });
  checkAuth();
})();

// ===== 禁止爬虫/F12/右键 =====
(function() {
  document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) || (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S'))) {
      e.preventDefault(); return false;
    }
  });
  var _open = false;
  setInterval(function() {
    if (window.outerWidth - window.innerWidth > 200 || window.outerHeight - window.innerHeight > 200) {
      if (!_open) { _open = true; document.body.innerHTML = '<div style="color:#ef4444;text-align:center;padding:50px;font-size:24px;">&#x26A0;&#xFE0F; 不允许的操作</div>'; }
    }
  }, 1000);
})();
</script>
