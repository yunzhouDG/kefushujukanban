<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="googlebot" content="noindex, nofollow, noarchive">
    <meta http-equiv="X-Robots-Tag" content="noindex, nofollow">
    <script>window.dataVersion = '20260520_1705';</script>
    <title>客服清洗数据看板 - CC+钉钉整合</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0a0e1a 0%, #1e293b 50%, #0f172a 100%);
            color: #f8fafc;
            padding: 20px;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 30%, #db2777 70%, #f43f5e 100%);
            padding: 44px 40px;
            border-radius: 22px;
            margin-bottom: 28px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(79,70,229,0.3), 0 0 80px rgba(219,39,119,0.15);
        }
        .header::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(255,255,255,0.12) 0%, transparent 50%),
                        radial-gradient(circle at 70% 60%, rgba(255,255,255,0.08) 0%, transparent 40%);
            animation: headerGlow 8s ease-in-out infinite alternate;
        }
        .header h1 {
            font-size: 38px;
            margin-bottom: 10px;
            position: relative;
            letter-spacing: 1px;
            text-shadow: 0 2px 20px rgba(0,0,0,0.3);
        }
        .header p {
            opacity: 0.92;
            position: relative;
            font-size: 15px;
            letter-spacing: 1px;
        }
        
        .filter-bar {
            background: linear-gradient(145deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
            backdrop-filter: blur(12px);
            padding: 20px 24px;
            border-radius: 18px;
            margin-bottom: 26px;
            display: flex;
            gap: 22px;
            align-items: center;
            flex-wrap: wrap;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 2px 16px rgba(0,0,0,0.12);
        }
        .filter-item { display: flex; align-items: center; gap: 8px; }
        .filter-item label { color: #94a3b8; font-size: 14px; }
        select, input[type="date"] {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 14px;
        }
        select option {
            background: #1e293b;
            color: #fff;
            padding: 8px;
            font-size: 14px;
        }
        select {
            min-width: 140px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.02) 100%);
            backdrop-filter: blur(12px);
            padding: 28px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 12px 36px rgba(0,0,0,0.3);
            border-color: rgba(255,255,255,0.18);
        }
        .stat-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3.5px;
            border-radius: 18px 18px 0 0;
        }
        .stat-card.total::after { background: linear-gradient(90deg, #60a5fa, #3b82f6, #818cf8); box-shadow: 0 0 12px rgba(96,165,250,0.5); }
        .stat-card.clean::after { background: linear-gradient(90deg, #f472b6, #ec4899, #f43f5e); box-shadow: 0 0 12px rgba(244,114,182,0.4); }
        .stat-card.valid::after { background: linear-gradient(90deg, #34d399, #10b981, #059669); box-shadow: 0 0 12px rgba(52,211,153,0.45); }
        .stat-card.rate::after { background: linear-gradient(90deg, #fbbf24, #f59e0b, #d97706); box-shadow: 0 0 12px rgba(251,191,36,0.45); }
        .stat-card.kezi::after { background: linear-gradient(90deg, #a78bfa, #8b5cf6, #7c3aed); box-shadow: 0 0 12px rgba(167,139,250,0.45); }
        .stat-card h3 {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        .stat-value {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-breakdown {
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.5;
        }
        .stat-breakdown span.cc-tag { color: #60a5fa; }
        .stat-breakdown span.dd-tag { color: #34d399; }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            margin-bottom: 24px;
        }
        .chart-container {
            background: linear-gradient(145deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.01) 100%);
            padding: 22px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.08);
            height: 380px;
            transition: all 0.3s ease;
        }
        .chart-container:hover {
            border-color: rgba(99,102,241,0.2);
            box-shadow: 0 8px 28px rgba(0,0,0,0.2);
        }
        .chart-container.full-width {
            grid-column: 1 / -1;
            height: 420px;
        }
        .chart-title {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chart-content {
            height: calc(100% - 35px);
        }
        
        .detail-section {
            background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
            backdrop-filter: blur(12px);
            padding: 28px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 26px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.1);
        }
        .detail-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .brand-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }
        .brand-card {
            background: rgba(255,255,255,0.03);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .brand-card h4 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #fff;
        }
        .brand-stats {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .brand-stat-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }
        .brand-stat-label { color: #94a3b8; }
        .brand-stat-value { color: #fff; font-weight: 600; }
        
        .data-table { width: 100%; border-collapse: separate; border-spacing: 0; display: block; overflow-x: auto; white-space: nowrap; }
        .data-table th, .data-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .data-table th {
            color: #94a3b8;
            font-weight: 500;
            font-size: 13px;
            text-transform: uppercase;
        }
        .data-table { width: 100%; border-collapse: separate; border-spacing: 0; display: block; overflow-x: auto; white-space: nowrap; }
        .data-table td { color: #f8fafc; }
        .data-table tr:hover { background: rgba(255,255,255,0.03); }

        /* 客服工作量排行 - 卡片式布局（美化版） */
        .visitor-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }
        .visitor-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
            border-radius: 18px;
            padding: 22px 24px;
            border: 1px solid rgba(255,255,255,0.09);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .visitor-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.35);
            border-color: rgba(99,102,241,0.25);
        }
        .visitor-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6, #a78bfa);
            opacity: 0.8;
        }
        /* 前三名特殊光效 */
        .visitor-card.rank-1::before { background: linear-gradient(90deg, #fbbf24, #f59e0b, #d97706); opacity: 1; height: 4px;}
        .visitor-card.rank-2::before { background: linear-gradient(90deg, #94a3b8, #64748b, #475569); opacity: 1; height: 4px;}
        .visitor-card.rank-3::before { background: linear-gradient(90deg, #cd7c2f, #a16207, #854d0e); opacity: 1; height: 4px;}

        .visitor-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }
        .visitor-rank {
            width: 38px; height: 38px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 17px;
            color: #0f172a;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .visitor-name {
            font-size: 19px; font-weight: 700; color: #fff;
            letter-spacing: 0.5px;
        }

        .visitor-types {
            display: flex; flex-direction: column; gap: 9px;
        }
        .type-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 11px 15px;
            border-radius: 11px;
            transition: all 0.2s ease;
        }
        .type-row:hover { transform: translateX(3px); filter: brightness(1.1); }
        .type-row.card { background: rgba(16,185,129,0.08); border-left: 3.5px solid #34d399; }
        .type-row.jx { background: rgba(245,158,11,0.08); border-left: 3.5px solid #fbbf24; }
        .type-row.other { background: rgba(100,116,139,0.12); border-left: 3.5px solid #94a3b8; }
        /* 汇总卡片特殊样式 */
        .summary-total-card {
            grid-column: 1 / -1;  /* 占满整行 */
            background: linear-gradient(145deg, rgba(99,102,241,0.1) 0%, rgba(139,92,246,0.04) 100%);
            border: 1.5px solid rgba(99,102,241,0.25);
        }
        .summary-total-card::before {
            background: linear-gradient(90deg, #6366f1, #8b5cf6, #a78bfa) !important;
        }
        .type-label { font-size: 13px; color: #cbd5e1; min-width: 90px; font-weight: 500; }
        .type-stats { font-size: 14px; color: #cbd5e1; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
        .type-stats b { color: #fff; font-size: 15px; font-weight: 600; }
        .type-rate {
            font-size: 14px; font-weight: 700; margin-left: 8px;
            padding: 2px 8px; border-radius: 6px;
            min-width: 52px; text-align: center; display: inline-block;
        }
        .type-row.card .type-rate { background: rgba(16,185,129,0.15); color: #34d399; }
        .type-row.jx .type-rate { background: rgba(245,158,11,0.15); color: #fbbf24; }
        .type-row.other .type-rate { background: rgba(100,116,139,0.2); color: #94a3b8; }

        .visitor-summary-bar {
            display: flex; align-items: center; gap: 18px;
            padding: 12px 16px;
            margin-bottom: 14px;
            background: linear-gradient(90deg, rgba(99,102,241,0.08) 0%, rgba(139,92,246,0.05) 100%);
            border-radius: 12px;
            border: 1px solid rgba(99,102,241,0.12);
            font-size: 14px;
        }
        .sum-item { color: #94a3b8; letter-spacing: 0.3px; }
        .sum-item b { color: #e2e8f0; font-size: 16px; font-weight: 600; }
        .sum-item:nth-child(1) b { color: #60a5fa; }   /* 电话蓝色 */
        .sum-item:nth-child(3) b { color: #34d399; }   /* 有效绿色 */
        .sum-rate {
            font-size: 21px; font-weight: 800;
            color: #34d399;
            margin-left: auto;
            text-shadow: 0 0 20px rgba(52,211,153,0.3);
            padding: 3px 12px;
            background: rgba(52,211,153,0.08);
            border-radius: 8px;
        }

        @media (max-width: 1200px) {
            .stats-grid { grid-template-columns: repeat(3, 1fr); }
            .charts-grid { grid-template-columns: 1fr; }
            .brand-grid { grid-template-columns: repeat(2, 1fr); }
            .visitor-cards { grid-template-columns: 1fr; }
        }

        @keyframes headerGlow {
            from { transform: translate(0, 0); }
            to { transform: translate(2%, -2%); }
        }
    </style>
</head>
<body>
    <div id="app" style="display:none">
    <div class="header">
        <h1>📊 客服清洗数据看板</h1>
        <p>CC系统 + 钉钉跟进 | 品牌×客资类型交叉分析</p>
    </div>

    <div class="filter-bar">
        <div class="filter-item">
            <label>开始日期</label>
            <input type="date" id="startDate" onchange="applyFilter()">
        </div>
        <div class="filter-item">
            <label>结束日期</label>
            <input type="date" id="endDate" onchange="applyFilter()">
        </div>
        <div class="filter-item">
            <label>品牌筛选</label>
            <select id="brandFilter" onchange="applyFilter()">
                <option value="all">全部品牌</option>
                <option value="美的">美的</option>
                <option value="小天鹅">小天鹅</option>
                <option value="COLMO">COLMO</option>
                <option value="东芝">东芝</option>
            </select>
        </div>
        <div class="filter-item">
            <label>品类筛选</label>
            <select id="typeFilter" onchange="applyFilter()">
                <option value="all">全部品类</option>
                <option value="客服卡片">客服卡片</option>
                <option value="家享联盟">家享联盟</option>
                <option value="其他">其他</option>
            </select>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card kezi">
            <h3>📋 客资量</h3>
            <div class="stat-value" id="keziCount">-</div>
        </div>
        <div class="stat-card total">
            <h3>📞 总电话量</h3>
            <div class="stat-value" id="totalCalls">-</div>
            <div class="stat-breakdown" id="totalCallsBreakdown"></div>
        </div>
        <div class="stat-card clean">
            <h3>🧹 清洗量</h3>
            <div class="stat-value" id="cleanCount">-</div>
            <div class="stat-breakdown" id="cleanCountBreakdown"></div>
        </div>
        <div class="stat-card valid">
            <h3>✅ 有效量</h3>
            <div class="stat-value" id="validCount">-</div>
            <div class="stat-breakdown" id="validCountBreakdown"></div>
        </div>
        <div class="stat-card rate">
            <h3>📈 有效率</h3>
            <div class="stat-value" id="validRate">-</div>
        </div>
    </div>

    <div class="charts-grid">
        <div class="chart-container full-width">
            <div class="chart-title">📈 数据趋势分析</div>
            <div class="chart-content" id="trendChart"></div>
        </div>
        <div class="chart-container">
            <div class="chart-title">🏷️ 品牌分布</div>
            <div class="chart-content" id="brandChart"></div>
        </div>
        <div class="chart-container">
            <div class="chart-title">📋 客资类型分布</div>
            <div class="chart-content" id="customerTypeChart"></div>
        </div>
        <div class="chart-container">
            <div class="chart-title">📊 品牌×客资类型热力图</div>
            <div class="chart-content" id="heatmapChart"></div>
        </div>
        <div class="chart-container">
            <div class="chart-title">⚡ 客服处理量 TOP10</div>
            <div class="chart-content" id="visitorChart"></div>
        </div>
    </div>

    <div class="detail-section">
        <div class="detail-title"><span>🏢</span> 各品牌客资明细</div>
        <div class="brand-grid" id="brandDetailGrid"></div>
    </div>

    <div class="detail-section">
        <div class="detail-title"><span>👥</span> 客服工作量排行 TOP20</div>
        <div id="visitorTable"></div>
    </div>

    <script>
        var dashboardData = null;
        let trendChart, brandChart, customerTypeChart, heatmapChart, visitorChart;

        function init() {
            initDatePicker();
            initCharts();
            applyFilter();
        }

        function initDatePicker() {
            if (!dashboardData || !dashboardData.length) return;
            const dates = dashboardData.map(d => d['日期']);
            document.getElementById('startDate').min = dates[0];
            document.getElementById('startDate').max = dates[dates.length - 1];
            document.getElementById('startDate').value = dates[0];
            document.getElementById('endDate').min = dates[0];
            document.getElementById('endDate').max = dates[dates.length - 1];
            document.getElementById('endDate').value = dates[dates.length - 1];
        }

        function initCharts() {
            trendChart = echarts.init(document.getElementById('trendChart'));
            brandChart = echarts.init(document.getElementById('brandChart'));
            customerTypeChart = echarts.init(document.getElementById('customerTypeChart'));
            heatmapChart = echarts.init(document.getElementById('heatmapChart'));
            visitorChart = echarts.init(document.getElementById('visitorChart'));
        }

        function mergeData(startDate, endDate, brandFilter, typeFilter) {
            let filtered = dashboardData.filter(d => d['日期'] >= startDate && d['日期'] <= endDate);
            
            const summary = {
                kezi_count: 0,
                total_calls: 0,
                total_calls_cc: 0,
                total_calls_dd: 0,
                clean_count: 0,
                clean_count_cc: 0,
                clean_count_dd: 0,
                valid_count: 0,
                valid_count_cc: 0,
                valid_count_dd: 0,
                brand_distribution: {},
                customer_type_distribution: {},
                visitor_stats: {},
                visitor_calls: {},
                visitor_clean: {},
                visitor_valid: {},
                visitor_type_detail: {},
                visitor_type_clean: {},
                visitor_type_valid: {},
                brand_customer_cross: {},
                daily_data: filtered
            };
            
            filtered.forEach(day => {
                // 合并指标（支持品牌+品类筛选）
                if (brandFilter === 'all') {
                    summary.kezi_count += (day['客资量'] || 0);
                    summary.total_calls += day['总电话量'];
                    summary.total_calls_cc += day['总电话量_CC'];
                    summary.total_calls_dd += day['总电话量_钉钉'];
                    summary.clean_count += day['清洗量'];
                    summary.clean_count_cc += day['清洗量_CC'];
                    summary.clean_count_dd += day['清洗量_钉钉'];
                    summary.valid_count += day['有效量'];
                    summary.valid_count_cc += day['有效量_CC'];
                    summary.valid_count_dd += day['有效量_钉钉'];

                    Object.entries(day['品牌分布']).forEach(([brand, count]) => {
                        summary.brand_distribution[brand] = (summary.brand_distribution[brand] || 0) + count;
                    });
                    
                    Object.entries(day['客资类型分布']).forEach(([type, count]) => {
                        if (typeFilter === 'all' || type === typeFilter) {
                            summary.customer_type_distribution[type] = (summary.customer_type_distribution[type] || 0) + count;
                        }
                    });
                    
                    Object.entries(day['回访人统计']).forEach(([visitor, count]) => {
                        summary.visitor_stats[visitor] = (summary.visitor_stats[visitor] || 0) + count;
                    });
                    
                    Object.entries(day['回访人_电话量'] || {}).forEach(([visitor, count]) => {
                        summary.visitor_calls[visitor] = (summary.visitor_calls[visitor] || 0) + count;
                    });
                    Object.entries(day['回访人_清洗量'] || {}).forEach(([visitor, count]) => {
                        summary.visitor_clean[visitor] = (summary.visitor_clean[visitor] || 0) + count;
                    });
                    Object.entries(day['回访人_有效量'] || {}).forEach(([visitor, count]) => {
                        summary.visitor_valid[visitor] = (summary.visitor_valid[visitor] || 0) + count;
                    });
                    
                    ['客服卡片', '家享联盟', '其他'].forEach(function(t) {
                        if (typeFilter !== 'all' && t !== typeFilter) return;
                        var tc = day['回访人_类型_电话量'] || {};
                        Object.entries(tc).forEach(([v, c]) => {
                            if (!summary.visitor_type_detail[v]) { summary.visitor_type_detail[v] = {'客服卡片': 0, '家享联盟': 0, '其他': 0}; }
                            if (c && typeof c === 'object') { summary.visitor_type_detail[v][t] += (c[t] || 0); }
                            else { summary.visitor_type_detail[v][t] += c || 0; }
                        });
                        var cl = day['回访人_类型_清洗量'] || {};
                        Object.entries(cl).forEach(([v, c]) => {
                            if (!summary.visitor_type_clean[v]) { summary.visitor_type_clean[v] = {'客服卡片': 0, '家享联盟': 0, '其他': 0}; }
                            if (c && typeof c === 'object') { summary.visitor_type_clean[v][t] += (c[t] || 0); }
                            else { summary.visitor_type_clean[v][t] += c || 0; }
                        });
                        var vl = day['回访人_类型_有效量'] || {};
                        Object.entries(vl).forEach(([v, c]) => {
                            if (!summary.visitor_type_valid[v]) { summary.visitor_type_valid[v] = {'客服卡片': 0, '家享联盟': 0, '其他': 0}; }
                            if (c && typeof c === 'object') { summary.visitor_type_valid[v][t] += (c[t] || 0); }
                            else { summary.visitor_type_valid[v][t] += c || 0; }
                        });
                    });
                    
                    Object.entries(day['品牌客资交叉']).forEach(([brand, types]) => {
                        if (!summary.brand_customer_cross[brand]) {
                            summary.brand_customer_cross[brand] = {};
                        }
                        Object.entries(types).forEach(([type, count]) => {
                            if (typeFilter === 'all' || type === typeFilter) {
                                summary.brand_customer_cross[brand][type] = (summary.brand_customer_cross[brand][type] || 0) + count;
                            }
                        });
                    });
                } else {
                    const ccBrandDist = day['品牌分布_CC'] || {};
                    const ddBrandDist = day['品牌分布_钉钉'] || {};
                    const crossCC = day['品牌客资交叉_CC'] || {};
                    const crossDD = day['品牌客资交叉_钉钉'] || {};
                    const keziBrand = day['客资量_品牌'] || {};
                    summary.kezi_count += (keziBrand[brandFilter] || 0);

                    summary.total_calls += (ccBrandDist[brandFilter] || 0) + (ddBrandDist[brandFilter] || 0);
                    summary.total_calls_cc += ccBrandDist[brandFilter] || 0;
                    summary.total_calls_dd += ddBrandDist[brandFilter] || 0;

                    // 按品类筛选时，只统计该品类的交叉数据
                    const crossCCTotal = typeFilter === 'all'
                        ? Object.values(crossCC[brandFilter] || {}).reduce((a,b)=>a+b, 0)
                        : (crossCC[brandFilter] || {})[typeFilter] || 0;
                    const crossDDTotal = typeFilter === 'all'
                        ? Object.values(crossDD[brandFilter] || {}).reduce((a,b)=>a+b, 0)
                        : (crossDD[brandFilter] || {})[typeFilter] || 0;
                    summary.clean_count += crossCCTotal + crossDDTotal;
                    summary.clean_count_cc += crossCCTotal;
                    summary.clean_count_dd += crossDDTotal;

                    const dayValidRate = day['有效率'] > 0 ? day['有效率'] / 100 : 0;
                    summary.valid_count += Math.round((crossCCTotal + crossDDTotal) * dayValidRate);

                    summary.brand_distribution[brandFilter] = (summary.brand_distribution[brandFilter] || 0)
                        + (ccBrandDist[brandFilter] || 0) + (ddBrandDist[brandFilter] || 0);
                    
                    if (typeFilter === 'all') {
                        if (crossCC[brandFilter]) {
                            Object.entries(crossCC[brandFilter]).forEach(([type, count]) => {
                                summary.customer_type_distribution[type] = (summary.customer_type_distribution[type] || 0) + count;
                            });
                        }
                        if (crossDD[brandFilter]) {
                            Object.entries(crossDD[brandFilter]).forEach(([type, count]) => {
                                summary.customer_type_distribution[type] = (summary.customer_type_distribution[type] || 0) + count;
                            });
                        }
                    } else {
                        summary.customer_type_distribution[typeFilter] = crossCCTotal + crossDDTotal;
                    }

                    var vbtForStats = day['回访人_品牌_类型'] || {};
                    Object.entries(vbtForStats).forEach(([visitor, brands_data]) => {
                        if (brands_data[brandFilter]) {
                            var btStat = brands_data[brandFilter];
                            if (typeFilter === 'all') {
                                var statTotal = Object.values(btStat).reduce(function(a,b){return a+b;}, 0);
                                summary.visitor_stats[visitor] = (summary.visitor_stats[visitor] || 0) + statTotal;
                            } else {
                                summary.visitor_stats[visitor] = (summary.visitor_stats[visitor] || 0) + (btStat[typeFilter] || 0);
                            }
                        }
                    });

                    var vbt = day['回访人_品牌_类型'] || {};
                    var vbtClean = day['回访人_品牌_类型_清洗量'] || {};
                    var vbtValid = day['回访人_品牌_类型_有效量'] || {};
                    Object.entries(vbt).forEach(([visitor, brands_data]) => {
                        if (brands_data[brandFilter]) {
                            var bt = brands_data[brandFilter];
                            var btCl = (vbtClean[visitor] && vbtClean[visitor][brandFilter]) || {};
                            var btVl = (vbtValid[visitor] && vbtValid[visitor][brandFilter]) || {};
                            var pTotal = typeFilter === 'all'
                                ? Object.values(bt).reduce(function(a,b){return a+b;}, 0)
                                : (bt[typeFilter] || 0);
                            var pClean = typeFilter === 'all'
                                ? Object.values(btCl).reduce(function(a,b){return a+b;}, 0)
                                : (btCl[typeFilter] || 0);
                            var pValid = typeFilter === 'all'
                                ? Object.values(btVl).reduce(function(a,b){return a+b;}, 0)
                                : (btVl[typeFilter] || 0);
                            summary.visitor_calls[visitor] = (summary.visitor_calls[visitor] || 0) + pTotal;
                            summary.visitor_clean[visitor] = (summary.visitor_clean[visitor] || 0) + pClean;
                            summary.visitor_valid[visitor] = (summary.visitor_valid[visitor] || 0) + pValid;
                            
                            if (!summary.visitor_type_detail[visitor]) { summary.visitor_type_detail[visitor] = {'客服卡片': 0, '家享联盟': 0, '其他': 0}; }
                            if (!summary.visitor_type_clean[visitor]) { summary.visitor_type_clean[visitor] = {'客服卡片': 0, '家享联盟': 0, '其他': 0}; }
                            if (!summary.visitor_type_valid[visitor]) { summary.visitor_type_valid[visitor] = {'客服卡片': 0, '家享联盟': 0, '其他': 0}; }
                            if (typeFilter === 'all') {
                                ['客服卡片', '家享联盟', '其他'].forEach(function(t) {
                                    summary.visitor_type_detail[visitor][t] += (bt[t] || 0);
                                    summary.visitor_type_clean[visitor][t] += (btCl[t] || 0);
                                    summary.visitor_type_valid[visitor][t] += (btVl[t] || 0);
                                });
                            } else {
                                summary.visitor_type_detail[visitor][typeFilter] += pTotal;
                                summary.visitor_type_clean[visitor][typeFilter] += pClean;
                                summary.visitor_type_valid[visitor][typeFilter] += pValid;
                            }
                        }
                    });

                    if (!summary.brand_customer_cross[brandFilter]) {
                        summary.brand_customer_cross[brandFilter] = {'客服卡片': 0, '家享联盟': 0, '其他': 0};
                    }
                    if (crossCC[brandFilter]) {
                        Object.entries(crossCC[brandFilter]).forEach(([type, count]) => {
                            if (typeFilter === 'all' || type === typeFilter) {
                                summary.brand_customer_cross[brandFilter][type] =
                                    (summary.brand_customer_cross[brandFilter][type] || 0) + count;
                            }
                        });
                    }
                    if (crossDD[brandFilter]) {
                        Object.entries(crossDD[brandFilter]).forEach(([type, count]) => {
                            if (typeFilter === 'all' || type === typeFilter) {
                                summary.brand_customer_cross[brandFilter][type] =
                                    (summary.brand_customer_cross[brandFilter][type] || 0) + count;
                            }
                        });
                    }
                }
            });
            
            summary.valid_rate = summary.clean_count > 0 ? (summary.valid_count / summary.clean_count * 100).toFixed(1) : 0;
            
            return summary;
        }

        function applyFilter() {
            if (!dashboardData || !dashboardData.length) return;

            const endDate = document.getElementById('endDate').value;
            const brandFilter = document.getElementById('brandFilter').value;
            const typeFilter = document.getElementById('typeFilter').value;
            
            const summary = mergeData(startDate, endDate, brandFilter, typeFilter);
            
            // 更新统计卡片 - 显示CC和钉钉分别的数据
            document.getElementById('keziCount').textContent = summary.kezi_count.toLocaleString();
            document.getElementById('totalCalls').textContent = summary.total_calls.toLocaleString();
            document.getElementById('cleanCount').textContent = summary.clean_count.toLocaleString();
            document.getElementById('validCount').textContent = summary.valid_count.toLocaleString();
            document.getElementById('validRate').textContent = summary.valid_rate + '%';

            // 数据源分解显示

                '<span class="cc-tag">CC: ' + summary.total_calls_cc.toLocaleString() +
                '</span>&nbsp;&nbsp;<span class="dd-tag">钉钉: ' + summary.total_calls_dd.toLocaleString() + '</span>';
            document.getElementById('cleanCountBreakdown').innerHTML =
                '<span class="cc-tag">CC: ' + summary.clean_count_cc.toLocaleString() +
                '</span>&nbsp;&nbsp;<span class="dd-tag">钉钉: ' + summary.clean_count_dd.toLocaleString() + '</span>';
            document.getElementById('validCountBreakdown').innerHTML =
                '<span class="cc-tag">CC: ' + summary.valid_count_cc.toLocaleString() +
                '</span>&nbsp;&nbsp;<span class="dd-tag">钉钉: ' + summary.valid_count_dd.toLocaleString() + '</span>';

        function updateVisitorTable(summary, typeFilter) {
            // === 计算汇总数据 ===
            var totalCalls = 0, totalClean = 0, totalValid = 0;
            Object.values(summary.visitor_calls || {}).forEach(function(v){totalCalls += v;});
            Object.values(summary.visitor_clean || {}).forEach(function(v){totalClean += v;});
            Object.values(summary.visitor_valid || {}).forEach(function(v){totalValid += v;});
            var totalRate = totalClean > 0 ? (totalValid / totalClean * 100).toFixed(1) : '0.0';

            // 按类型汇总（从所有客服的数据累加）
            var sumCardC=0, sumCardCl=0, sumCardV=0;
            var sumJxC=0, sumJxCl=0, sumJxV=0;
            var sumOthC=0, sumOthCl=0, sumOthV=0;
            Object.values(summary.visitor_type_detail || {}).forEach(function(v){
                sumCardC += (v['客服卡片']||0);
                sumJxC   += (v['家享联盟']||0);
                sumOthC += (v['其他']||0);
            });
            Object.values(summary.visitor_type_clean || {}).forEach(function(v){
                sumCardCl += (v['客服卡片']||0);
                sumJxCl  += (v['家享联盟']||0);
                sumOthCl += (v['其他']||0);
            });
            Object.values(summary.visitor_type_valid || {}).forEach(function(v){
                sumCardV += (v['客服卡片']||0);
                sumJxV  += (v['家享联盟']||0);
                sumOthV += (v['其他']||0);

            // === 汇总卡片（所有客服合计）===

                '<div class="visitor-header">' +
                    '<span class="visitor-rank" style="background:linear-gradient(135deg,#6366f1,#a78bfa);color:#fff;font-size:14px;width:36px;height:36px;">总</span>' +
                    '<span class="visitor-name">📊 客服汇总</span>' +
                '</div>' +
                '<div class="visitor-summary-bar" style="background:linear-gradient(90deg,rgba(99,102,241,0.12) 0%,rgba(167,139,250,0.08) 100%);border:1px solid rgba(99,102,241,0.2);">' +
                    '<span class="sum-item">电话: <b style="color:#60a5fa">' + totalCalls.toLocaleString() + '</b></span>' +
                    '<span class="sum-item">清洗: <b style="color:#f472b6">' + totalClean.toLocaleString() + '</b></span>' +
                    '<span class="sum-item">有效: <b style="color:#34d399">' + totalValid.toLocaleString() + '</b></span>' +
                    '<span class="sum-rate">' + totalRate + '%</span>' +
                '</div>' +
                '<div class="visitor-types">' +
                    '<div class="type-row card">' +
                        '<span class="type-label">📋 客服卡片</span>' +
                        '<span class="type-stats"><b>' + sumCardC + '</b> / <b>' + sumCardCl + '</b> / <b>' + sumCardV + '</b>' +
                        '<span class="type-rate" style="color:' + (sumCardCl>0?(sumCardV/sumCardCl*100>=50?'#34d399':'#fbbf24'):'#94a3b8') + '">' + (sumCardCl>0?(sumCardV/sumCardCl*100).toFixed(1):'0.0') + '%</span>' +
                    '</div>' +
                    '<div class="type-row jx">' +
                        '<span class="type-label">🤝 家享联盟</span>' +
                        '<span class="type-stats"><b>' + sumJxC + '</b> / <b>' + sumJxCl + '</b> / <b>' + sumJxV + '</b>' +
                        '<span class="type-rate" style="color:' + (sumJxCl>0?(sumJxV/sumJxCl*100>=20?'#34d399':'#fbbf24'):'#94a3b8') + '">' + (sumJxCl>0?(sumJxV/sumJxCl*100).toFixed(1):'0.0') + '%</span>' +
                    '</div>' +
                    '<div class="type-row other">' +
                        '<span class="type-label">📦 其他</span>' +
                        '<span class="type-stats"><b>' + sumOthC + '</b> / <b>' + sumOthCl + '</b> / <b>' + sumOthV + '</b>' +
                        '<span class="type-rate" style="color:' + (sumOthCl>0?(sumOthV/sumOthCl*100>=40?'#34d399':'#fbbf24'):'#94a3b8') + '">' + (sumOthCl>0?(sumOthV/sumOthCl*100).toFixed(1):'0.0') + '%</span>' +
                    '</div>' +
                '</div>' +
            '</div>';

            sorted.forEach(function(item, idx) {
                var name = item[0];
                var calls = (summary.visitor_calls && summary.visitor_calls[name]) || 0;
                var clean = (summary.visitor_clean && summary.visitor_clean[name]) || 0;
                var valid = (summary.visitor_valid && summary.visitor_valid[name]) || 0;
                var totalRate = clean > 0 ? (valid / clean * 100).toFixed(1) : '0.0';
                
                var td = (summary.visitor_type_detail && summary.visitor_type_detail[name]) || {};
                var tcl = (summary.visitor_type_clean && summary.visitor_type_clean[name]) || {};
                var tvl = (summary.visitor_type_valid && summary.visitor_type_valid[name]) || {};
                
                var cardC = td['客服卡片'] || 0;
                var cardCl = tcl['客服卡片'] || 0;
                var cardV = tvl['客服卡片'] || 0;
                var cardR = cardCl > 0 ? (cardV / cardCl * 100).toFixed(1) : '0.0';
                
                var jxC = td['家享联盟'] || 0;
                var jxCl = tcl['家享联盟'] || 0;
                var jxV = tvl['家享联盟'] || 0;
                var jxR = jxCl > 0 ? (jxV / jxCl * 100).toFixed(1) : '0.0';
                
                var otherC = td['其他'] || 0;
                var otherCl = tcl['其他'] || 0;
                var otherV = tvl['其他'] || 0;
                var otherR = otherCl > 0 ? (otherV / otherCl * 100).toFixed(1) : '0.0';
                
                var rankColor = idx < 3 ? ['#fbbf24', '#94a3b8', '#b45309'][idx] : '#64748b';
                var rankClass = idx < 3 ? ' rank-' + (idx + 1) : '';
                
                html += '<div class="visitor-card' + rankClass + '">' +
                    '<div class="visitor-header">' +
                        '<span class="visitor-rank" style="background:' + rankColor + '">' + (idx+1) + '</span>' +
                        '<span class="visitor-name">' + name + '</span>' +
                    '</div>' +
                    '<div class="visitor-summary-bar">' +
                        '<span class="sum-item">电话: <b>' + calls.toLocaleString() + '</b></span>' +
                        '<span class="sum-item">清洗: <b>' + clean.toLocaleString() + '</b></span>' +
                        '<span class="sum-item">有效: <b>' + valid.toLocaleString() + '</b></span>' +
                        '<span class="sum-rate">' + totalRate + '%</span>' +
                    '</div>';
                
                if (typeFilter === 'all') {
                    html += '<div class="visitor-types">' +
                        '<div class="type-row card">' +
                            '<span class="type-label">📋 客服卡片</span>' +
                            '<span class="type-stats">' +
                                '<b>' + cardC + '</b> / <b>' + cardCl + '</b> / <b>' + cardV + '</b>' +
                                '<span class="type-rate" style="color:' + (cardR >= 50 ? '#34d399' : '#fbbf24') + '">' + cardR + '%</span>' +
                            '</span>' +
                        '</div>' +
                        '<div class="type-row jx">' +
                            '<span class="type-label">🤝 家享联盟</span>' +
                            '<span class="type-stats">' +
                                '<b>' + jxC + '</b> / <b>' + jxCl + '</b> / <b>' + jxV + '</b>' +
                                '<span class="type-rate" style="color:' + (jxR >= 20 ? '#34d399' : '#fbbf24') + '">' + jxR + '%</span>' +
                            '</span>' +
                        '</div>' +
                        '<div class="type-row other">' +
                            '<span class="type-label">📦 其他</span>' +
                            '<span class="type-stats">' +
                                '<b>' + otherC + '</b> / <b>' + otherCl + '</b> / <b>' + otherV + '</b>' +
                                '<span class="type-rate" style="color:' + (otherR >= 40 ? '#34d399' : '#fbbf24') + '">' + otherR + '%</span>' +
                            '</span>' +
                        '</div>' +
                    '</div>';
                } else {
                    // 只显示选中的品类
                    var tc = (td[typeFilter] || 0);
                    var tcl_v = (tcl[typeFilter] || 0);
                    var tvl_v = (tvl[typeFilter] || 0);
                    var tr = tcl_v > 0 ? (tvl_v / tcl_v * 100).toFixed(1) : '0.0';
                    var trowClass = typeFilter === '客服卡片' ? 'card' : typeFilter === '家享联盟' ? 'jx' : 'other';
                    var tlabel = typeFilter === '客服卡片' ? '📋 ' + typeFilter : typeFilter === '家享联盟' ? '🤝 ' + typeFilter : '📦 ' + typeFilter;
                    html += '<div class="visitor-types">' +
                        '<div class="type-row ' + trowClass + '">' +
                            '<span class="type-label">' + tlabel + '</span>' +
                            '<span class="type-stats">' +
                                '<b>' + tc + '</b> / <b>' + tcl_v + '</b> / <b>' + tvl_v + '</b>' +
                                '<span class="type-rate" style="color:' + (tr >= 50 ? '#34d399' : '#fbbf24') + '">' + tr + '%</span>' +
                            '</span>' +
                        '</div>' +
                    '</div>';
                }
                html += '</div>';
            });
            html += '</div>';
            document.getElementById('visitorTable').innerHTML = html;
        }

        window.addEventListener('resize', function() {
            trendChart && trendChart.resize();
            brandChart && brandChart.resize();
            customerTypeChart && customerTypeChart.resize();
            heatmapChart && heatmapChart.resize();
            visitorChart && visitorChart.resize();
        });

        // init() 由登录成功后的 decryptAndLoad 调用，不在此处执行
    </script>
    </div><!-- #app -->

    <!-- 登录覆盖层 -->
    <div id="login-overlay" style="position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#050a18 0%,#0a1128 50%,#1a1a2e 100%);display:flex;align-items:center;justify-content:center;z-index:9999;">
        <div style="text-align:center;padding:40px 50px;background:rgba(15,23,42,0.85);border-radius:18px;border:1px solid rgba(99,102,241,0.25);box-shadow:0 8px 40px rgba(79,70,229,0.2);min-width:340px;">
            <h2 style="color:#e2e8f0;margin:0 0 8px;font-size:22px;font-weight:600;">🔒 客服清洗数据看板</h2>
            <p style="color:#94a3b8;margin:0 0 25px;font-size:14px;">请输入访问密码</p>
            <div style="display:flex;gap:10px;justify-content:center;align-items:center;">
                <input type="password" id="login-input" placeholder="请输入密码" autofocus style="width:200px;padding:12px 16px;border:1px solid rgba(99,102,241,0.3);border-radius:8px;background:rgba(15,23,42,0.8);color:#e2e8f0;font-size:16px;outline:none;">
                <button id="login-btn" style="padding:12px 24px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;border-radius:8px;color:#fff;font-size:16px;cursor:pointer;">确认</button>
            </div>
            <div id="login-error" style="color:#ef4444;margin-top:15px;font-size:13px;display:none;">密码错误，请重试</div>
        </div>
    </div>

    <script>
    
    (function() {
      var KEY = 'cc_auth_ok';

      // 使用 localStorage（持久化），兼容浏览器隐私保护拦截
      function safeGetStorage(key) {
        try { return localStorage.getItem(key); } catch(e) { return null; }
      }
      function safeSetStorage(key, val) {
        try { localStorage.setItem(key, val); } catch(e) { /* 静默忽略 */ }
      }
      function safeRemoveStorage(key) {
        try { localStorage.removeItem(key); } catch(e) { /* 静默忽略 */ }
      }

      function checkAuth() {
        var cached = safeGetStorage(KEY);
        if (cached) {
          document.getElementById('login-overlay').style.display = 'none';
          decryptAndLoad(cached);
        } else {
          // app 初始隐藏，login-overlay 显示
          var appEl = document.getElementById('app');
          if (appEl) appEl.style.display = 'none';
        }
      }

      function doLogin() {
        var pwd = document.getElementById('login-input').value;
        if (!pwd) return;
        document.getElementById('login-error').style.display = 'none';
        decryptAndLoad(pwd);
      }

      async function decryptAndLoad(pwd) {
        try {
          // 从外部文件加载加密数据
          const encRes = await fetch('https://cdn.jsdelivr.net/gh/yunzhouDG/kefushujukanban@main/dashboard_data.enc?t=' + Date.now());
          if (!encRes.ok) {
            console.error('Failed to load encrypted data');
            showLoginError();
            return;
          }
          const enc_data64 = await encRes.text();
          if (!enc_data64 || enc_data64.trim() === '') {
            console.error('Empty encrypted data');
            showLoginError();
            return;
          }

          var enc = new TextEncoder();
          var keyMaterial = await crypto.subtle.importKey(
            'raw', enc.encode(pwd), {name:'PBKDF2'}, false, ['deriveKey']
          );
          var key = await crypto.subtle.deriveKey(
            { name:'PBKDF2', salt: enc.encode('dashboard'), iterations:10000, hash:'SHA-256' },
            keyMaterial,
            { name:'AES-CBC', length:256 },
            false,
            ['decrypt']
          );
          var bin = atob(enc_data64.trim());
          var bytes = new Uint8Array(bin.length);
          for (var i=0; i<bin.length; i++) bytes[i] = bin.charCodeAt(i);
          var iv = bytes.slice(0,16);
          var data = bytes.slice(16);
          var decrypted = await crypto.subtle.decrypt({name:'AES-CBC', iv:iv}, key, data);
          dashboardData = JSON.parse(new TextDecoder().decode(decrypted));
          safeSetStorage(KEY, pwd);
          document.getElementById('login-overlay').style.display = 'none';
          document.getElementById('app').style.display = 'block';
          initDatePicker();
          initCharts();
          applyFilter();
        } catch(e) {
          safeRemoveStorage(KEY);
          showLoginError();
          console.error('Decrypt failed:', e);
        }
      }

      function showLoginError() {
        var overlay = document.getElementById('login-overlay');
        var appEl = document.getElementById('app');
        if (overlay) overlay.style.display = '';
        if (appEl) appEl.style.display = 'none';
        var errEl = document.getElementById('login-error');
        if (errEl) errEl.style.display = 'block';
        var inputEl = document.getElementById('login-input');
        if (inputEl) { inputEl.value = ''; inputEl.focus(); }
      }

      document.getElementById('login-btn').addEventListener('click', doLogin);
      document.getElementById('login-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') doLogin();
      });

      checkAuth();
    })();

    // ===== 禁止爬虫/F12/右键 =====
    (function() {
      document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) || (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S'))) {
          e.preventDefault(); return false;
        }
      });
      var _open = false;
      setInterval(function() {
        if (window.outerWidth - window.innerWidth > 200 || window.outerHeight - window.innerHeight > 200) {
          if (!_open) { _open = true; document.body.innerHTML = ''; }
        }
      }, 1000);
    })();
    </script>
